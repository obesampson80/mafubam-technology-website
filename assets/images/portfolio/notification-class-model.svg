<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Class responsibility model</title>
  <desc id="desc">A clean UML-style responsibility model showing the main classes used in the notification receptivity workflow.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#0c9bb2"/></marker><style>.t{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;fill:#08233f}.c{fill:#fff;stroke:#c9d8e2;stroke-width:2}.hi{fill:#edf6f8;stroke:#c9d8e2;stroke-width:2}.h{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:800;fill:#08233f}.m{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;fill:#50657a}.rel{stroke:#0c9bb2;stroke-width:3.5;fill:none;stroke-linecap:round;marker-end:url(#arrow)}</style></defs>
  <rect width="960" height="540" fill="#f7fbfc"/><rect x="42" y="38" width="876" height="464" rx="18" fill="#fff" stroke="#d7e4eb" stroke-width="2"/><text x="76" y="88" class="t">Class responsibility model</text>
  <g><rect x="84" y="134" width="170" height="116" rx="10" class="hi"/><text x="112" y="166" class="h">NotificationEvent</text><line x1="84" y1="178" x2="254" y2="178" stroke="#d8e3ea"/><text x="112" y="204" class="m">metadata</text><text x="112" y="226" class="m">timestamp, priority</text>
  <rect x="304" y="134" width="170" height="116" rx="10" class="c"/><text x="336" y="166" class="h">ContextSnapshot</text><line x1="304" y1="178" x2="474" y2="178" stroke="#d8e3ea"/><text x="336" y="204" class="m">time, location</text><text x="336" y="226" class="m">behaviour state</text>
  <rect x="524" y="134" width="170" height="116" rx="10" class="c"/><text x="556" y="166" class="h">FeatureExtractor</text><line x1="524" y1="178" x2="694" y2="178" stroke="#d8e3ea"/><text x="556" y="204" class="m">build_features()</text><text x="556" y="226" class="m">encode_inputs()</text>
  <rect x="304" y="324" width="170" height="116" rx="10" class="c"/><text x="344" y="356" class="h">Predictor</text><line x1="304" y1="368" x2="474" y2="368" stroke="#d8e3ea"/><text x="336" y="394" class="m">train()</text><text x="336" y="416" class="m">predict_proba()</text>
  <rect x="524" y="324" width="170" height="116" rx="10" class="c"/><text x="556" y="356" class="h">Scheduler</text><line x1="524" y1="368" x2="694" y2="368" stroke="#d8e3ea"/><text x="556" y="394" class="m">decide()</text><text x="556" y="416" class="m">batch_or_defer()</text>
  <rect x="744" y="228" width="150" height="116" rx="10" class="hi"/><text x="778" y="260" class="h">Evaluator</text><line x1="744" y1="272" x2="894" y2="272" stroke="#d8e3ea"/><text x="774" y="298" class="m">metrics()</text><text x="774" y="320" class="m">export_report()</text></g>
  <path d="M254 192H296" class="rel"/><path d="M474 192H516" class="rel"/><path d="M609 250V316" class="rel"/><path d="M474 382H516" class="rel"/><path d="M694 382C750 382 780 360 794 344" class="rel"/><path d="M390 250V316" class="rel"/>
</svg>
