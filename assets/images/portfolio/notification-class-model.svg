<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Notification management class responsibility model</title>
  <desc id="desc">A clean UML-style responsibility diagram showing the classes involved in turning notification evidence into a delivery decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L11 6L1 11Z" fill="#0f172a"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #0b1f35; }
      .class { fill: #ffffff; stroke: #334155; stroke-width: 1.6; }
      .entity { fill: #e8f7fb; stroke: #0e9caf; stroke-width: 1.7; }
      .output { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.7; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #0b1f35; }
      .member { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; }
      .rel { stroke: #0f172a; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="38" y="34" width="884" height="468" rx="5" class="panel"/>
  <text x="72" y="82" class="title">Class Responsibility Model</text>

  <rect x="78" y="134" width="184" height="126" rx="4" class="entity"/>
  <text x="106" y="166" class="head">NotificationRequest</text>
  <line x1="78" y1="180" x2="262" y2="180" stroke="#cbd5e1"/>
  <text x="106" y="206" class="member">source</text>
  <text x="106" y="228" class="member">message type</text>
  <text x="106" y="250" class="member">timestamp</text>

  <rect x="322" y="134" width="184" height="126" rx="4" class="entity"/>
  <text x="350" y="166" class="head">ContextSnapshot</text>
  <line x1="322" y1="180" x2="506" y2="180" stroke="#cbd5e1"/>
  <text x="350" y="206" class="member">time window</text>
  <text x="350" y="228" class="member">activity state</text>
  <text x="350" y="250" class="member">recent history</text>

  <rect x="566" y="134" width="184" height="126" rx="4" class="class"/>
  <text x="594" y="166" class="head">FeatureBuilder</text>
  <line x1="566" y1="180" x2="750" y2="180" stroke="#cbd5e1"/>
  <text x="594" y="206" class="member">validate()</text>
  <text x="594" y="228" class="member">normalise()</text>
  <text x="594" y="250" class="member">buildVector()</text>

  <rect x="200" y="340" width="184" height="126" rx="4" class="class"/>
  <text x="228" y="372" class="head">DecisionEngine</text>
  <line x1="200" y1="386" x2="384" y2="386" stroke="#cbd5e1"/>
  <text x="228" y="412" class="member">scoreReceptivity()</text>
  <text x="228" y="434" class="member">applyPriority()</text>
  <text x="228" y="456" class="member">recommendAction()</text>

  <rect x="444" y="340" width="184" height="126" rx="4" class="class"/>
  <text x="472" y="372" class="head">DeliveryController</text>
  <line x1="444" y1="386" x2="628" y2="386" stroke="#cbd5e1"/>
  <text x="472" y="412" class="member">selectWindow()</text>
  <text x="472" y="434" class="member">dispatchOrDefer()</text>
  <text x="472" y="456" class="member">recordOutcome()</text>

  <rect x="688" y="340" width="184" height="126" rx="4" class="output"/>
  <text x="716" y="372" class="head">DeliveryDecision</text>
  <line x1="688" y1="386" x2="872" y2="386" stroke="#fed7aa"/>
  <text x="716" y="412" class="member">action</text>
  <text x="716" y="434" class="member">scheduled time</text>
  <text x="716" y="456" class="member">reason code</text>

  <path d="M262 198H314" class="rel"/>
  <path d="M506 198H558" class="rel"/>
  <path d="M658 260V302H292V332" class="rel"/>
  <path d="M384 403H436" class="rel"/>
  <path d="M628 403H680" class="rel"/>
</svg>

