<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Machine condition analysis flow</title>
  <desc id="desc">A clean workflow diagram showing vibration data moving through windowing, feature extraction, validation and condition-report output.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0e9aac"/></marker>
    <style>
      .bg{fill:#f4f9fb}.panel{fill:#fff;stroke:#cfe0e8;stroke-width:2}.stage{fill:#fff;stroke:#cfe0e8;stroke-width:2}.input{fill:#e8f7fb;stroke:#0e9aac;stroke-width:2}.output{fill:#fff;stroke:#0e9aac;stroke-width:2}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.title{font-size:30px}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.line{fill:none;stroke:#0e9aac;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-teal)}.soft{fill:#eaf3f6}.dark{fill:#082744}.accent{fill:#0e9aac}.orange{fill:#f68a3c}
    </style>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <rect class="panel" x="28" y="26" width="904" height="488" rx="22"/>
  <text class="ink title" x="62" y="78">Analysis flow</text>
  <text class="muted small" x="64" y="106">From vibration records to a report-ready machine condition result.</text>

  <rect class="input" x="62" y="166" width="150" height="172" rx="16"/>
  <text class="ink label" x="92" y="204">Raw data</text>
  <text class="muted small" x="92" y="236">Vibration files</text>
  <text class="muted small" x="92" y="260">Machine labels</text>
  <text class="muted small" x="92" y="284">Sampling notes</text>

  <path class="line" d="M212 252H258"/>

  <rect class="stage" x="270" y="166" width="150" height="172" rx="16"/>
  <text class="ink label" x="300" y="204">Windowing</text>
  <text class="muted small" x="300" y="236">Segment signals</text>
  <text class="muted small" x="300" y="260">Clean rows</text>
  <text class="muted small" x="300" y="284">Align classes</text>

  <path class="line" d="M420 252H466"/>

  <rect class="stage" x="478" y="166" width="150" height="172" rx="16"/>
  <text class="ink label" x="508" y="204">Features</text>
  <text class="muted small" x="508" y="236">Time statistics</text>
  <text class="muted small" x="508" y="260">Frequency values</text>
  <text class="muted small" x="508" y="284">Scaled table</text>

  <path class="line" d="M628 252H674"/>

  <rect class="stage" x="686" y="166" width="150" height="172" rx="16"/>
  <text class="ink label" x="716" y="204">Validation</text>
  <text class="muted small" x="716" y="236">Train/test split</text>
  <text class="muted small" x="716" y="260">Compare models</text>
  <text class="muted small" x="716" y="284">Review errors</text>

  <path class="line" d="M761 338V380"/>

  <rect class="output" x="522" y="392" width="314" height="78" rx="16"/>
  <text class="ink label" x="554" y="424">Condition report</text>
  <text class="muted small" x="554" y="450">Prediction, confidence and notes</text>
</svg>

