<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Machine condition analysis workflow</title>
  <desc id="desc">A clean data-analysis workflow showing raw vibration records moving through windowing, feature extraction, model validation and report-ready insight.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L11 6L1 11Z" fill="#0f172a"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #0b1f35; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #0b1f35; }
      .copy { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; }
      .stage { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .input { fill: #e8f7fb; stroke: #0e9caf; stroke-width: 1.6; }
      .output { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.6; }
      .flow { stroke: #0f172a; stroke-width: 2.3; fill: none; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="38" y="34" width="884" height="468" rx="5" class="panel"/>
  <text x="72" y="82" class="title">Analysis Workflow</text>
  <text x="72" y="108" class="subtitle">From vibration records to validated machine-condition evidence.</text>

  <rect x="72" y="168" width="150" height="178" rx="4" class="input"/>
  <text x="98" y="202" class="head">Raw records</text>
  <text x="98" y="232" class="copy">vibration files</text>
  <text x="98" y="254" class="copy">machine labels</text>
  <text x="98" y="276" class="copy">sampling notes</text>
  <rect x="104" y="304" width="86" height="12" rx="6" fill="#0e9caf" opacity="0.9"/>

  <rect x="270" y="168" width="150" height="178" rx="4" class="stage"/>
  <text x="296" y="202" class="head">Windowing</text>
  <text x="296" y="232" class="copy">segment signals</text>
  <text x="296" y="254" class="copy">remove weak rows</text>
  <text x="296" y="276" class="copy">align classes</text>
  <rect x="302" y="304" width="86" height="12" rx="6" fill="#e2e8f0"/>

  <rect x="468" y="168" width="150" height="178" rx="4" class="stage"/>
  <text x="494" y="202" class="head">Feature table</text>
  <text x="494" y="232" class="copy">time statistics</text>
  <text x="494" y="254" class="copy">frequency features</text>
  <text x="494" y="276" class="copy">scaled inputs</text>
  <rect x="500" y="304" width="86" height="12" rx="6" fill="#e2e8f0"/>

  <rect x="666" y="168" width="150" height="178" rx="4" class="stage"/>
  <text x="692" y="202" class="head">Validation</text>
  <text x="692" y="232" class="copy">train/test split</text>
  <text x="692" y="254" class="copy">model comparison</text>
  <text x="692" y="276" class="copy">error review</text>
  <rect x="698" y="304" width="86" height="12" rx="6" fill="#e2e8f0"/>

  <rect x="330" y="386" width="300" height="78" rx="4" class="output"/>
  <text x="362" y="414" class="head">Report-ready insight</text>
  <text x="362" y="438" class="copy">condition prediction and confidence evidence</text>
  <text x="362" y="458" class="copy">with concise interpretation notes</text>

  <path d="M222 257H262" class="flow"/>
  <path d="M420 257H460" class="flow"/>
  <path d="M618 257H658" class="flow"/>
  <path d="M741 346V374Q741 425 638 425" class="flow"/>
  <text x="72" y="482" class="small">Each stage has one purpose, making the analysis easier to defend than raw notebook output.</text>
</svg>

