<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Formatted manuscript output review</title>
  <desc id="desc">A modern output review graphic showing document map, figure list, table list, equation checks, references and final review readiness.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#082744" flood-opacity="0.12"/></filter>
    <style>.bg{fill:#eef7fa}.panel{fill:#fff;stroke:#cfe0e8;stroke-width:2}.card{fill:#fff;stroke:#d8e7ee;stroke-width:1.5}.ready{fill:#e8f7fb;stroke:#0e9aac;stroke-width:2}.soft{fill:#eaf3f6}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.title{font-size:29px}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:12px}.teal{fill:#0e9aac}.orange{fill:#f68a3c}.success{fill:#25a96a}.warn{fill:#f68a3c}.rule{fill:#d8e7ee}.dark{fill:#082744}</style>
  </defs>
  <rect class="bg" width="1100" height="660"/>
  <rect class="panel" x="32" y="30" width="1036" height="600" rx="26" filter="url(#shadow)"/>
  <text class="ink title" x="72" y="84">Submission-ready output review</text>
  <text class="muted small" x="74" y="112">Final checks focus on what a reviewer sees: navigation, numbering, references and export quality.</text>

  <rect class="card" x="72" y="154" width="284" height="386" rx="22"/>
  <text class="ink label" x="104" y="198">Document map</text>
  <g class="muted small">
    <text x="104" y="246">Abstract</text><text x="104" y="286">Introduction</text><text x="104" y="326">Methodology</text><text x="104" y="366">Results</text><text x="104" y="406">References</text>
  </g>
  <rect class="teal" x="230" y="236" width="70" height="10" rx="5"/>
  <rect class="teal" x="230" y="276" width="86" height="10" rx="5"/>
  <rect class="teal" x="230" y="316" width="102" height="10" rx="5"/>
  <rect class="orange" x="230" y="356" width="76" height="10" rx="5"/>
  <rect class="teal" x="230" y="396" width="92" height="10" rx="5"/>
  <text class="muted small" x="104" y="480"><tspan x="104" dy="0">Structure can be checked</tspan><tspan x="104" dy="22">quickly before sharing.</tspan></text>

  <rect class="card" x="392" y="154" width="292" height="386" rx="22"/>
  <text class="ink label" x="424" y="198">Lists and numbering</text>
  <rect class="soft" x="424" y="236" width="214" height="48" rx="14"/>
  <circle class="success" cx="450" cy="260" r="7"/><text class="ink tiny" x="470" y="265">Figures 1-4 checked</text>
  <rect class="soft" x="424" y="310" width="214" height="48" rx="14"/>
  <circle class="success" cx="450" cy="334" r="7"/><text class="ink tiny" x="470" y="339">Tables 1-6 checked</text>
  <rect class="soft" x="424" y="384" width="214" height="48" rx="14"/>
  <circle class="warn" cx="450" cy="408" r="7"/><text class="ink tiny" x="470" y="413">Equation fields checked</text>
  <text class="muted small" x="424" y="480"><tspan x="424" dy="0">Numbering stays readable</tspan><tspan x="424" dy="22">after Word/PDF export.</tspan></text>

  <rect class="ready" x="720" y="154" width="308" height="386" rx="22"/>
  <text class="ink label" x="752" y="198">Final readiness</text>
  <circle class="success" cx="766" cy="246" r="7"/><text class="muted small" x="788" y="252">Styles consistent</text>
  <circle class="success" cx="766" cy="292" r="7"/><text class="muted small" x="788" y="298">Captions refreshable</text>
  <circle class="success" cx="766" cy="338" r="7"/><text class="muted small" x="788" y="344">Tables readable</text>
  <circle class="success" cx="766" cy="384" r="7"/><text class="muted small" x="788" y="390">References cleaned</text>
  <circle class="success" cx="766" cy="430" r="7"/><text class="muted small" x="788" y="436">PDF export ready</text>
  <rect class="teal" x="752" y="476" width="154" height="36" rx="12"/>
  <text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" x="778" y="499">Ready for review</text>
</svg>

