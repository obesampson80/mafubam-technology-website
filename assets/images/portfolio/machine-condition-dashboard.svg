<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Machine condition analysis dashboard</title>
  <desc id="desc">A professional dashboard overview showing vibration data windows, feature extraction, model comparison, condition prediction and reviewer notes.</desc>
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #0b1f35; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #475569; }
      .value { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #0b1f35; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #0b1f35; }
      .copy { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .shell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; }
      .nav { fill: #0b1f35; }
      .card { fill: #ffffff; stroke: #d7e2ea; stroke-width: 1.4; }
      .soft { fill: #f8fafc; stroke: #d7e2ea; stroke-width: 1.4; }
      .accent { fill: #0e9caf; }
      .orange { fill: #f97316; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .line { fill: none; stroke: #0e9caf; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .line2 { fill: none; stroke: #f97316; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="34" y="30" width="1132" height="620" rx="5" class="shell"/>
  <rect x="34" y="30" width="92" height="620" rx="5" class="nav"/>
  <rect x="62" y="66" width="36" height="36" rx="4" fill="#e8f7fb"/>
  <text x="74" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0b1f35">M</text>
  <g fill="#e8f7fb" opacity="0.88"><rect x="68" y="150" width="24" height="6" rx="3"/><rect x="68" y="204" width="24" height="6" rx="3"/><rect x="68" y="258" width="24" height="6" rx="3"/><rect x="68" y="312" width="24" height="6" rx="3"/><rect x="68" y="366" width="24" height="6" rx="3"/></g>

  <text x="164" y="78" class="title">Machine Condition Analysis Dashboard</text>
  <text x="164" y="106" class="small">Public-safe recreation of the analysis workspace used to inspect vibration windows, features and predictions.</text>

  <rect x="164" y="142" width="212" height="92" rx="4" class="soft"/>
  <text x="188" y="174" class="label">DATA WINDOWS</text>
  <text x="188" y="210" class="value">3,920</text>
  <rect x="400" y="142" width="212" height="92" rx="4" class="soft"/>
  <text x="424" y="174" class="label">FEATURE COLUMNS</text>
  <text x="424" y="210" class="value">48</text>
  <rect x="636" y="142" width="212" height="92" rx="4" class="soft"/>
  <text x="660" y="174" class="label">VALIDATION MACRO-F1</text>
  <text x="660" y="210" class="value">0.92</text>
  <rect x="872" y="142" width="236" height="92" rx="4" class="soft"/>
  <text x="896" y="174" class="label">CURRENT CONDITION</text>
  <text x="896" y="210" class="value">Fault risk</text>

  <rect x="164" y="270" width="454" height="244" rx="4" class="card"/>
  <text x="190" y="308" class="head">Vibration Window Preview</text>
  <g class="grid"><path d="M198 462H572"/><path d="M198 416H572"/><path d="M198 370H572"/><path d="M198 324H572"/></g>
  <path d="M198 420C220 350 236 488 260 402C284 316 306 466 330 386C356 302 382 446 406 376C434 302 466 430 492 360C520 296 544 408 572 334" class="line"/>
  <path d="M198 444C232 432 266 420 300 434C338 448 368 424 400 438C438 454 486 412 524 424C548 430 562 418 572 410" class="line2"/>
  <text x="198" y="488" class="small">Segmented signal window with baseline overlay</text>

  <rect x="650" y="270" width="214" height="244" rx="4" class="card"/>
  <text x="676" y="308" class="head">Feature Evidence</text>
  <text x="676" y="342" class="copy">RMS energy</text><rect x="676" y="354" width="146" height="10" rx="5" fill="#e2e8f0"/><rect x="676" y="354" width="116" height="10" rx="5" class="accent"/>
  <text x="676" y="388" class="copy">Peak amplitude</text><rect x="676" y="400" width="146" height="10" rx="5" fill="#e2e8f0"/><rect x="676" y="400" width="98" height="10" rx="5" class="orange"/>
  <text x="676" y="434" class="copy">Spectral spread</text><rect x="676" y="446" width="146" height="10" rx="5" fill="#e2e8f0"/><rect x="676" y="446" width="126" height="10" rx="5" class="accent"/>
  <text x="676" y="488" class="small">Key drivers prepared for reviewer discussion</text>

  <rect x="894" y="270" width="214" height="244" rx="4" class="card"/>
  <text x="920" y="308" class="head">Model Comparison</text>
  <g class="grid"><path d="M940 462H1062"/><path d="M940 424H1062"/><path d="M940 386H1062"/><path d="M940 348H1062"/></g>
  <rect x="950" y="358" width="24" height="104" rx="4" class="accent"/>
  <rect x="990" y="382" width="24" height="80" rx="4" class="accent"/>
  <rect x="1030" y="414" width="24" height="48" rx="4" class="orange"/>
  <text x="938" y="490" class="small">Tree</text><text x="984" y="490" class="small">SVM</text><text x="1024" y="490" class="small">Base</text>

  <rect x="164" y="544" width="944" height="62" rx="4" fill="#f8fafc" stroke="#d7e2ea"/>
  <text x="190" y="580" class="head">Reviewer note</text>
  <text x="320" y="580" class="copy">The dashboard connects raw signal behaviour, feature evidence and model output instead of showing isolated notebook screenshots.</text>
</svg>
