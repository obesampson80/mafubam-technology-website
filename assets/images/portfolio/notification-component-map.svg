<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Component interaction map for a context-aware notification system</title>
  <desc id="desc">A clean left-to-right technical diagram showing data sources, processing stages, decision engine, outputs and feedback history.</desc>
  <rect width="960" height="540" fill="#f7fbfc"/>
  <rect x="48" y="42" width="864" height="456" rx="16" fill="#ffffff" stroke="#d8e3ea" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="82" y="86" fill="#08233f" font-size="22" font-weight="900">Component interaction map</text>
    <text x="82" y="112" fill="#50657a" font-size="12" font-weight="700">Notification event, context evidence, prediction logic and delivery decision separated by responsibility.</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">
    <rect x="82" y="154" width="170" height="220" rx="12" fill="#eef5f7" stroke="#c9d8e2"/>
