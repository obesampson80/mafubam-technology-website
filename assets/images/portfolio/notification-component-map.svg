    <text x="136" y="288" fill="#102033">Context</text>
    <rect x="108" y="322" width="118" height="34" rx="7" fill="#ffffff" stroke="#d8e3ea"/>
    <text x="137" y="344" fill="#102033">History</text>

    <rect x="314" y="142" width="350" height="262" rx="12" fill="#ffffff" stroke="#c9d8e2"/>
    <text x="348" y="172" fill="#08233f" font-size="14" font-weight="900">Core Processing</text>
    <rect x="344" y="206" width="120" height="46" rx="7" fill="#eef5f7" stroke="#d8e3ea"/>
    <text x="382" y="234" fill="#102033">Validate</text>
    <rect x="514" y="206" width="120" height="46" rx="7" fill="#eef5f7" stroke="#d8e3ea"/>
    <text x="553" y="234" fill="#102033">Encode</text>
    <rect x="344" y="298" width="120" height="46" rx="7" fill="#eef5f7" stroke="#d8e3ea"/>
    <text x="386" y="326" fill="#102033">Model</text>
    <rect x="514" y="298" width="120" height="46" rx="7" fill="#eef5f7" stroke="#d8e3ea"/>
    <text x="550" y="326" fill="#102033">Priority</text>
    <rect x="429" y="368" width="120" height="46" rx="7" fill="#08233f"/>
    <text x="469" y="396" fill="#ffffff">Fusion</text>

    <rect x="724" y="154" width="154" height="220" rx="12" fill="#eef5f7" stroke="#c9d8e2"/>
    <text x="768" y="184" fill="#08233f" font-size="14" font-weight="900">Outputs</text>
    <rect x="750" y="210" width="102" height="34" rx="7" fill="#ffffff" stroke="#d8e3ea"/>
    <text x="785" y="232" fill="#102033">Score</text>
    <rect x="750" y="266" width="102" height="34" rx="7" fill="#ffffff" stroke="#d8e3ea"/>
    <text x="776" y="288" fill="#102033">Decision</text>
    <rect x="750" y="322" width="102" height="34" rx="7" fill="#ffffff" stroke="#d8e3ea"/>
    <text x="784" y="344" fill="#102033">Report</text>
