<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Formal system architecture for context-aware notification management</title>
  <desc id="desc">A formal architecture diagram with external evidence sources, a system boundary, internal processing components, scheduling output, evaluation output and feedback update.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L11 6L1 11Z" fill="#1f2933"/>
    </marker>
    <marker id="feedback-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L11 6L1 11Z" fill="#8a4b18"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #4b5563; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .box-title { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .box-copy { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #4b5563; }
      .legend { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #374151; }
      .external { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.8; }
      .module { fill: #ffffff; stroke: #1f2933; stroke-width: 1.8; }
      .support { fill: #f3f7f9; stroke: #374151; stroke-width: 1.7; }
      .boundary { fill: none; stroke: #111827; stroke-width: 2.2; }
      .flow { stroke: #1f2933; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .feedback { stroke: #8a4b18; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; marker-end: url(#feedback-arrow); }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="58" y="54" class="title">Context-Aware Notification Management System Architecture</text>
  <text x="58" y="82" class="subtitle">Formal component-and-data-flow view showing how notification evidence is processed into delivery and evaluation outputs.</text>

  <text x="74" y="128" class="section">External evidence sources</text>
  <rect x="58" y="150" width="190" height="76" rx="3" class="external"/>
  <text x="84" y="182" class="box-title">Notification event</text>
  <text x="84" y="206" class="box-copy">source, category, time</text>

  <rect x="58" y="276" width="190" height="86" rx="3" class="external"/>
  <text x="84" y="308" class="box-title">Context signals</text>
  <text x="84" y="332" class="box-copy">time, location, screen</text>
  <text x="84" y="352" class="box-copy">activity, movement</text>

  <rect x="58" y="414" width="190" height="86" rx="3" class="external"/>
  <text x="84" y="446" class="box-title">Interaction history</text>
  <text x="84" y="470" class="box-copy">recent notification counts</text>
  <text x="84" y="490" class="box-copy">historical click rate</text>

  <rect x="306" y="126" width="626" height="418" rx="4" class="boundary"/>
  <text x="328" y="154" class="section">System boundary</text>

  <rect x="348" y="192" width="190" height="92" rx="3" class="module"/>
  <text x="374" y="226" class="box-title">Data ingestion</text>
  <text x="374" y="250" class="box-copy">validate required fields</text>
  <text x="374" y="270" class="box-copy">remove outcome leakage</text>

  <rect x="590" y="192" width="190" height="92" rx="3" class="module"/>
  <text x="616" y="226" class="box-title">Feature engineering</text>
  <text x="616" y="250" class="box-copy">encode categorical signals</text>
  <text x="616" y="270" class="box-copy">standardise numeric inputs</text>

  <rect x="590" y="352" width="190" height="92" rx="3" class="module"/>
  <text x="616" y="386" class="box-title">Priority features</text>
  <text x="616" y="410" class="box-copy">urgency and app category</text>
  <text x="616" y="430" class="box-copy">developer priority</text>

  <rect x="348" y="352" width="190" height="92" rx="3" class="support"/>
  <text x="374" y="386" class="box-title">Temporal validation</text>
  <text x="374" y="410" class="box-copy">chronological split</text>
  <text x="374" y="430" class="box-copy">user-holdout testing</text>

  <rect x="832" y="192" width="190" height="92" rx="3" class="module"/>
  <text x="858" y="226" class="box-title">Prediction model</text>
  <text x="858" y="250" class="box-copy">tree-based classifiers</text>
  <text x="858" y="270" class="box-copy">receptivity probability</text>

  <rect x="832" y="352" width="190" height="92" rx="3" class="module"/>
  <text x="858" y="386" class="box-title">Decision scheduler</text>
  <text x="858" y="410" class="box-copy">combine probability</text>
  <text x="858" y="430" class="box-copy">deliver, defer, batch</text>

  <text x="1012" y="128" class="section">System outputs</text>
  <rect x="1000" y="196" width="150" height="78" rx="3" class="external"/>
  <text x="1022" y="228" class="box-title">Delivery action</text>
  <text x="1022" y="252" class="box-copy">notification policy</text>

  <rect x="1000" y="370" width="150" height="88" rx="3" class="external"/>
  <text x="1022" y="402" class="box-title">Evaluation output</text>
  <text x="1022" y="426" class="box-copy">metrics, tables</text>
  <text x="1022" y="446" class="box-copy">report figures</text>

  <path d="M248 188H340" class="flow"/>
  <path d="M248 319H292Q322 319 322 238H340" class="flow"/>
  <path d="M248 457H292Q322 457 322 266H340" class="flow"/>
  <path d="M538 238H582" class="flow"/>
  <path d="M780 238H824" class="flow"/>
  <path d="M780 398H824" class="flow"/>
  <path d="M927 284V344" class="flow"/>
  <path d="M1022 238H992" class="flow"/>
  <path d="M1022 414H992" class="flow"/>
  <path d="M538 398H582" class="flow"/>
  <path d="M927 444V500H443V452" class="flow"/>

  <path d="M1076 458V598H153V508" class="feedback"/>
  <text x="370" y="626" class="legend">Dashed feedback path updates later interaction-history records.</text>
</svg>
