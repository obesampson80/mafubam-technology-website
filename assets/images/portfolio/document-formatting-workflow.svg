<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Manuscript formatting workflow</title>
  <desc id="desc">A clean workflow showing manuscript source review, structure cleanup, Word style control, caption-field handling and final review package.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e9aac"/>
    </marker>
    <style>
      .bg{fill:#f4f9fb}.panel{fill:#fff;stroke:#cfe0e8;stroke-width:2}.stage{fill:#fff;stroke:#cfe0e8;stroke-width:2}.input{fill:#e8f7fb;stroke:#0e9aac;stroke-width:2}.output{fill:#fff7ef;stroke:#f7bd8d;stroke-width:2}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.title{font-size:30px}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.line{fill:none;stroke:#0e9aac;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-teal)}.soft{fill:#eaf3f6}.accent{fill:#0e9aac}.dark{fill:#082744}
    </style>
  </defs>
  <rect class="bg" width="1100" height="600"/>
  <rect class="panel" x="30" y="28" width="1040" height="544" rx="26"/>
  <text class="ink title" x="70" y="84">Formatting workflow</text>
  <text class="muted small" x="72" y="114">From draft manuscript and figures to a clean Word-ready article.</text>

  <rect class="input" x="70" y="178" width="168" height="162" rx="16"/>
  <text class="ink label" x="104" y="222">Source review</text>
  <text class="muted small" x="104" y="254">Draft text</text>
  <text class="muted small" x="104" y="278">Figures and tables</text>
  <text class="muted small" x="104" y="302">Target rules</text>

  <path class="line" d="M248 259 H300"/>

  <rect class="stage" x="310" y="178" width="168" height="162" rx="16"/>
  <text class="ink label" x="344" y="222">Structure</text>
  <text class="muted small" x="344" y="254">Article sections</text>
  <text class="muted small" x="344" y="278">Headings</text>
  <text class="muted small" x="344" y="302">Keywords</text>

  <path class="line" d="M488 259 H540"/>

  <rect class="stage" x="550" y="178" width="168" height="162" rx="16"/>
  <text class="ink label" x="584" y="222">Word styles</text>
  <text class="muted small" x="584" y="254">Font and spacing</text>
  <text class="muted small" x="584" y="278">Paragraph rules</text>
  <text class="muted small" x="584" y="302">Table widths</text>

  <path class="line" d="M728 259 H780"/>

  <rect class="stage" x="790" y="178" width="168" height="162" rx="16"/>
  <text class="ink label" x="824" y="222">Fields</text>
  <text class="muted small" x="824" y="254">Captions</text>
  <text class="muted small" x="824" y="278">Equations</text>
  <text class="muted small" x="824" y="302">References</text>

  <path class="line" d="M874 350 V396"/>

  <rect class="output" x="724" y="408" width="300" height="86" rx="18"/>
  <text class="ink label" x="762" y="442">Review package</text>
  <text class="muted small" x="762" y="470">Formatted DOCX and PDF-ready layout</text>

  <rect class="soft" x="70" y="408" width="516" height="86" rx="18"/>
  <text class="ink label" x="104" y="442">Formatting principle</text>
  <text class="muted small" x="104" y="470">Keep the author's technical content intact while improving review readability.</text>
</svg>
