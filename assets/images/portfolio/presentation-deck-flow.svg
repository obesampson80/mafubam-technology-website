<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Defence presentation narrative flow</title>
  <desc id="desc">A recreated flow showing how the presentation moves from problem framing to baseline comparison, proposed protocol, evaluation evidence and final defence close.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e9aac"/>
    </marker>
    <style>
      .bg{fill:#f4f9fb}.card{fill:#fff;stroke:#cfe0e8;stroke-width:2}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.small{font-size:16px}.title{font-size:30px}.label{font-size:19px}.line{fill:none;stroke:#0e9aac;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-teal)}.dark{fill:#082744}.note{fill:#fff7ef;stroke:#f7bd8d;stroke-width:2}.soft{fill:#eaf3f6}
    </style>
  </defs>
  <rect class="bg" width="1100" height="600"/>
  <rect class="card" x="30" y="28" width="1040" height="544" rx="26"/>
  <text class="ink title" x="70" y="84">Defence narrative flow</text>
  <text class="muted small" x="72" y="114">Each section answers one review question before the deck moves forward.</text>

  <rect class="card" x="76" y="182" width="174" height="132" rx="16"/>
  <text class="ink label" x="104" y="226">Problem</text>
  <text class="muted small" x="104" y="258">Why normal</text>
  <text class="muted small" x="104" y="280">revocation fails</text>

  <path class="line" d="M260 248 H318"/>

  <rect class="card" x="328" y="182" width="174" height="132" rx="16"/>
  <text class="ink label" x="356" y="226">Gap</text>
  <text class="muted small" x="356" y="258">TinyOCSP still</text>
  <text class="muted small" x="356" y="280">misses SF12</text>

  <path class="line" d="M512 248 H570"/>

  <rect class="dark" x="580" y="182" width="190" height="132" rx="16"/>
  <text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" x="610" y="226">Proposed</text>
  <text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="16" x="610" y="258">CBOR, cache,</text>
  <text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="16" x="610" y="280">batch, MTU check</text>

  <path class="line" d="M780 248 H838"/>

  <rect class="card" x="848" y="182" width="174" height="132" rx="16"/>
  <text class="ink label" x="876" y="226">Evidence</text>
  <text class="muted small" x="876" y="258">Size, energy,</text>
  <text class="muted small" x="876" y="280">cache metrics</text>

  <path class="line" d="M935 324 V386"/>

  <rect class="note" x="774" y="398" width="248" height="78" rx="20"/>
  <text class="ink label" x="806" y="432">Final defence</text>
  <text class="muted small" x="806" y="458">Conclusion and questions</text>

  <rect class="soft" x="76" y="380" width="238" height="96" rx="18"/>
  <text class="ink label" x="104" y="420">Presenter support</text>
  <text class="muted small" x="104" y="448">Notes and timing checks</text>
</svg>

