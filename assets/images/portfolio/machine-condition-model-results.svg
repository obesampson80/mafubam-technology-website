<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Machine condition model validation summary</title>
  <desc id="desc">A polished validation summary showing model metrics, recording-level confusion matrix and concise interpretation notes.</desc>
  <defs>
    <style>
      .bg{fill:#f4f9fb}.panel{fill:#fff;stroke:#cfe0e8;stroke-width:2}.card{fill:#fff;stroke:#d8e7ee;stroke-width:1.5}.soft{fill:#f8fafc;stroke:#d8e7ee;stroke-width:1.3}.warn{fill:#fff7ef;stroke:#f7bd8d;stroke-width:1.5}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.title{font-size:29px}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:12px}.grid{stroke:#e2edf2;stroke-width:1}.teal{fill:#0e9aac}.orange{fill:#f68a3c}.navy{fill:#082744}.pale{fill:#e8f7fb}.rule{stroke:#d8e7ee;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <rect class="panel" x="34" y="28" width="892" height="484" rx="22"/>
  <text class="ink title" x="68" y="78">Model validation summary</text>

  <rect class="card" x="68" y="122" width="456" height="274" rx="18"/>
  <text class="ink label" x="98" y="160">Macro-F1 by validation view</text>
  <g class="grid"><path d="M126 342H480"/><path d="M126 292H480"/><path d="M126 242H480"/><path d="M126 192H480"/></g>
  <rect class="teal" x="158" y="202" width="42" height="140" rx="5"/><rect class="teal" x="242" y="218" width="42" height="124" rx="5"/><rect class="teal" x="326" y="234" width="42" height="108" rx="5"/><rect class="orange" x="410" y="284" width="42" height="58" rx="5"/>
  <text class="muted tiny" x="154" y="368">Binary</text><text class="muted tiny" x="232" y="368">Fault type</text><text class="muted tiny" x="318" y="368">Alt. model</text><text class="muted tiny" x="402" y="368">External</text>
  <text class="muted tiny" x="158" y="192">0.99</text><text class="muted tiny" x="242" y="208">0.92</text><text class="muted tiny" x="326" y="224">0.90</text><text class="muted tiny" x="410" y="274">0.47</text>

  <rect class="card" x="566" y="122" width="326" height="274" rx="18"/>
  <text class="ink label" x="596" y="160">Recording-level matrix</text>
  <g transform="translate(636 198)">
    <rect width="188" height="188" rx="8" fill="#fff" stroke="#d8e7ee"/>
    <rect x="10" y="10" width="38" height="38" class="navy"/><rect x="52" y="10" width="38" height="38" class="pale"/><rect x="94" y="10" width="38" height="38" fill="#f8fafc"/><rect x="136" y="10" width="38" height="38" fill="#f8fafc"/>
    <rect x="10" y="52" width="38" height="38" class="pale"/><rect x="52" y="52" width="38" height="38" class="teal"/><rect x="94" y="52" width="38" height="38" fill="#fed7aa"/><rect x="136" y="52" width="38" height="38" fill="#f8fafc"/>
    <rect x="10" y="94" width="38" height="38" fill="#f8fafc"/><rect x="52" y="94" width="38" height="38" fill="#fed7aa"/><rect x="94" y="94" width="38" height="38" class="teal"/><rect x="136" y="94" width="38" height="38" class="pale"/>
    <rect x="10" y="136" width="38" height="38" fill="#f8fafc"/><rect x="52" y="136" width="38" height="38" fill="#f8fafc"/><rect x="94" y="136" width="38" height="38" fill="#fed7aa"/><rect x="136" y="136" width="38" height="38" class="navy"/>
  </g>

  <rect class="soft" x="68" y="422" width="248" height="56" rx="16"/><text class="muted small" x="96" y="452">Strong result on prepared</text><text class="muted small" x="96" y="472">signal windows.</text>
  <rect class="soft" x="356" y="422" width="248" height="56" rx="16"/><text class="muted small" x="384" y="452">Class errors remain visible</text><text class="muted small" x="384" y="472">for interpretation.</text>
  <rect class="warn" x="644" y="422" width="248" height="56" rx="16"/><text class="muted small" x="672" y="452">External check reported</text><text class="muted small" x="672" y="472">without hiding weakness.</text>
</svg>
