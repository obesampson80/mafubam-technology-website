<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">LoRaWAN communication evidence screen</title>
  <desc id="desc">A modern communication evidence view showing source device, destination, certificate status, protocol console and final revocation result.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#082744" flood-opacity="0.12"/></filter><style>.bg{fill:#eef7fa}.panel{fill:#fff;stroke:#cfe0e8;stroke-width:2}.card{fill:#fff;stroke:#d8e7ee;stroke-width:1.5}.soft{fill:#eaf3f6}.blocked{fill:#fff7ef;stroke:#f7bd8d;stroke-width:2}.console{fill:#082744}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.mono{fill:#bdeef5;font-family:Consolas,monospace;font-weight:700}.title{font-size:29px}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:12px}.teal{fill:#0e9aac}.orange{fill:#f68a3c}.danger{fill:#b54720}.success{fill:#25a96a}</style></defs>
  <rect class="bg" width="1100" height="660"/><rect class="panel" x="32" y="30" width="1036" height="600" rx="26" filter="url(#shadow)"/>
  <text class="ink title" x="72" y="84">Communication evidence</text><text class="muted small" x="74" y="112">The screen links a simulator action to a traceable protocol decision.</text>
  <rect class="card" x="72" y="154" width="284" height="386" rx="22"/>
  <text class="ink label" x="104" y="198">Live attempt</text>
  <text class="muted small" x="104" y="246">Source: SENSOR-004</text><text class="muted small" x="104" y="286">Destination: GATEWAY-001</text><text class="muted small" x="104" y="326">Payload: 18 bytes</text><text class="muted small" x="104" y="366">Radio: SF10</text>
  <rect class="teal" x="104" y="434" width="146" height="38" rx="12"/><text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" x="132" y="458">Run attempt</text>
  <rect class="console" x="392" y="154" width="306" height="386" rx="22"/>
  <text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" x="424" y="198">Protocol console</text>
  <text class="mono tiny" x="424" y="250">[source] 10.0.0.14</text><text class="mono tiny" x="424" y="292">[cert] CERT-0017</text><text class="mono tiny" x="424" y="334">[request] 10 bytes</text><text class="mono tiny" x="424" y="376">[status] REVOKED</text><text class="mono tiny" x="424" y="418">[constraint] CERT</text><text class="mono tiny" x="424" y="460">[result] BLOCKED</text>
  <rect class="blocked" x="736" y="154" width="292" height="386" rx="22"/>
  <text class="ink label" x="768" y="198">Latest evidence</text>
  <text class="danger" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" x="768" y="252">Blocked</text>
  <circle class="orange" cx="780" cy="306" r="7"/><text class="muted small" x="802" y="312">Certificate revoked</text>
  <circle class="orange" cx="780" cy="350" r="7"/><text class="muted small" x="802" y="356">Handshake denied</text>
  <circle class="success" cx="780" cy="394" r="7"/><text class="muted small" x="802" y="400">Gateway cache hit</text>
  <circle class="success" cx="780" cy="438" r="7"/><text class="muted small" x="802" y="444">47 bytes tracked</text>
  <text class="muted small" x="768" y="500"><tspan x="768" dy="0">Decision is visible enough for</tspan><tspan x="768" dy="22">report discussion and defence.</tspan></text>
</svg>
