<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">LoRaWAN certificate revocation simulator dashboard</title>
  <desc id="desc">A modern public-safe simulator dashboard showing scenario controls, certificate metrics, protocol console and latest communication evidence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#082744" flood-opacity="0.14"/></filter>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4fbfd"/></linearGradient>
    <style>.bg{fill:#eef7fa}.shell{fill:url(#screen);stroke:#cfe0e8;stroke-width:2}.side{fill:#082744}.card{fill:#fff;stroke:#d8e7ee;stroke-width:1.5}.soft{fill:#eaf3f6}.blocked{fill:#fff7ef;stroke:#f7bd8d;stroke-width:2}.console{fill:#082744}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.white{fill:#fff;font-family:Arial,Helvetica,sans-serif}.mono{fill:#bdeef5;font-family:Consolas,monospace;font-weight:700}.title{font-size:31px}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:12px}.teal{fill:#0e9aac}.orange{fill:#f68a3c}.dark{fill:#082744}.rule{fill:#d8e7ee}.danger{fill:#b54720}</style>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <rect class="shell" x="42" y="38" width="1116" height="604" rx="28" filter="url(#shadow)"/>
  <rect class="side" x="42" y="38" width="94" height="604" rx="28"/><rect class="side" x="100" y="38" width="36" height="604"/>
  <rect class="teal" x="70" y="72" width="38" height="38" rx="11"/><text class="white" font-size="18" font-weight="700" x="82" y="97">M</text>
  <g opacity="0.92"><rect x="75" y="168" width="28" height="28" rx="8" fill="#143a5a"/><rect x="75" y="222" width="28" height="28" rx="8" fill="#143a5a"/><rect x="75" y="276" width="28" height="28" rx="8" fill="#143a5a"/><rect x="75" y="330" width="28" height="28" rx="8" fill="#143a5a"/><rect x="75" y="384" width="28" height="28" rx="8" fill="#143a5a"/></g>
  <circle class="teal" cx="89" cy="182" r="5"/><rect fill="#9fdfe8" x="83" y="232" width="12" height="6" rx="3"/><rect fill="#9fdfe8" x="82" y="286" width="14" height="14" rx="3"/><path d="M82 344 H96 M82 350 H92" stroke="#9fdfe8" stroke-width="2" stroke-linecap="round"/><circle fill="#f68a3c" cx="89" cy="398" r="6"/>
  <text class="ink title" x="176" y="88">LoRaWAN certificate revocation control</text>
  <text class="muted small" x="178" y="116">Public-safe recreation of the research simulator interface and evidence workflow.</text>
  <rect class="blocked" x="928" y="72" width="146" height="40" rx="13"/><text class="danger" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" x="958" y="97">BLOCKED</text>

  <g transform="translate(176 148)">
    <rect class="card" width="196" height="88" rx="18"/><text class="muted tiny" x="24" y="30">CERTIFICATES</text><text class="ink" font-size="28" x="24" y="64">20</text>
    <rect class="card" x="220" width="196" height="88" rx="18"/><text class="muted tiny" x="244" y="30">DEVICES</text><text class="ink" font-size="28" x="244" y="64">12</text>
    <rect class="card" x="440" width="196" height="88" rx="18"/><text class="muted tiny" x="464" y="30">EVENTS</text><text class="ink" font-size="28" x="464" y="64">20</text>
    <rect class="blocked" x="660" width="224" height="88" rx="18"/><text class="muted tiny" x="684" y="30">LATEST RESULT</text><text class="danger" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" x="684" y="64">Blocked</text>
  </g>

  <rect class="card" x="176" y="272" width="314" height="282" rx="22"/>
  <text class="ink label" x="206" y="312">Scenario inputs</text>
  <text class="muted small" x="206" y="356">Payload bytes</text><rect class="teal" x="342" y="346" width="96" height="11" rx="6"/>
  <text class="muted small" x="206" y="400">Cache TTL</text><rect class="teal" x="342" y="390" width="132" height="11" rx="6"/>
  <text class="muted small" x="206" y="444">Expired certs</text><rect class="orange" x="342" y="434" width="70" height="11" rx="6"/>
  <text class="muted small" x="206" y="488">Compromised keys</text><rect class="orange" x="342" y="478" width="86" height="11" rx="6"/>

  <rect class="console" x="522" y="272" width="286" height="282" rx="22"/>
  <text class="white" font-size="18" font-weight="700" x="552" y="312">Protocol console</text>
  <text class="mono tiny" x="552" y="356">[source] SENSOR-004</text>
  <text class="mono tiny" x="552" y="388">[cert] CERT-0017</text>
  <text class="mono tiny" x="552" y="420">[status] REVOKED</text>
  <text class="mono tiny" x="552" y="452">[bytes] 47 total</text>
  <text class="mono tiny" x="552" y="484">[result] BLOCKED</text>

  <rect class="card" x="840" y="272" width="234" height="282" rx="22"/>
  <text class="ink label" x="870" y="312">Latest evidence</text>
  <rect class="blocked" x="870" y="338" width="128" height="38" rx="12"/><text class="danger" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" x="900" y="362">Blocked</text>
  <text class="muted small" x="870" y="412">Reason: revoked cert</text>
  <text class="muted small" x="870" y="444">Path: revocation check</text>
  <text class="muted small" x="870" y="476">Radio: SF10 / cache hit</text>
  <text class="muted small" x="870" y="508">Energy: tracked</text>

  <rect class="soft" x="176" y="584" width="898" height="40" rx="16"/>
  <text class="ink tiny" x="204" y="609">Research purpose:</text><text class="muted tiny" x="326" y="609">make allowed and blocked LoRaWAN events visible, traceable and report-ready.</text>
</svg>
