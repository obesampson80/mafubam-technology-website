<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Research manuscript formatting workspace</title>
  <desc id="desc">A modern public-safe manuscript formatting workspace showing document structure, Word styles, figure and table handling, caption checks and review-ready output.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#082744" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4fbfd"/>
    </linearGradient>
    <style>
      .bg{fill:#eef7fa}.shell{fill:url(#screen);stroke:#cfe0e8;stroke-width:2}.side{fill:#082744}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.white{fill:#fff;font-family:Arial,Helvetica,sans-serif}.title{font-size:31px}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:12px}.card{fill:#fff;stroke:#d8e7ee;stroke-width:1.5}.soft{fill:#eaf3f6}.paper{fill:#fff;stroke:#d8e7ee;stroke-width:1.5}.teal{fill:#0e9aac}.orange{fill:#f68a3c}.dark{fill:#082744}.line{stroke:#d8e7ee;stroke-width:1.2}.rule{fill:#d8e7ee}.success{fill:#25a96a}.warn{fill:#f68a3c}
    </style>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <rect class="shell" x="42" y="38" width="1116" height="604" rx="28" filter="url(#shadow)"/>

  <rect class="side" x="42" y="38" width="94" height="604" rx="28"/>
  <rect class="side" x="100" y="38" width="36" height="604"/>
  <rect x="70" y="72" width="38" height="38" rx="11" fill="#0e9aac"/>
  <text class="white" font-size="18" font-weight="700" x="82" y="97">M</text>
  <g opacity="0.9">
    <rect x="75" y="168" width="28" height="28" rx="8" fill="#143a5a"/>
    <rect x="75" y="222" width="28" height="28" rx="8" fill="#143a5a"/>
    <rect x="75" y="276" width="28" height="28" rx="8" fill="#143a5a"/>
    <rect x="75" y="330" width="28" height="28" rx="8" fill="#143a5a"/>
    <rect x="75" y="384" width="28" height="28" rx="8" fill="#143a5a"/>
  </g>
  <circle class="teal" cx="89" cy="182" r="5"/>
  <rect fill="#9fdfe8" x="83" y="232" width="12" height="6" rx="3"/>
  <rect fill="#9fdfe8" x="82" y="286" width="14" height="14" rx="3"/>
  <path d="M82 344 H96 M82 350 H92" stroke="#9fdfe8" stroke-width="2" stroke-linecap="round"/>
  <circle fill="#f68a3c" cx="89" cy="398" r="6"/>

  <text class="ink title" x="176" y="88">Research manuscript formatting workspace</text>
  <text class="muted small" x="178" y="116">Public-safe recreation of a Word-ready article preparation workflow.</text>
  <rect class="teal" x="920" y="72" width="154" height="40" rx="13"/>
  <text class="white" font-size="14" font-weight="700" x="946" y="97">DOCX ready</text>

  <g transform="translate(176 148)">
    <rect class="card" width="196" height="88" rx="18"/>
    <text class="muted tiny" x="24" y="30">SECTION SYSTEM</text>
    <text class="ink" font-size="28" x="24" y="64">IMRaD</text>
    <rect class="card" x="220" width="196" height="88" rx="18"/>
    <text class="muted tiny" x="244" y="30">FIGURES CHECKED</text>
    <text class="ink" font-size="28" x="244" y="64">4 visuals</text>
    <rect class="card" x="440" width="196" height="88" rx="18"/>
    <text class="muted tiny" x="464" y="30">TABLES NORMALISED</text>
    <text class="ink" font-size="28" x="464" y="64">6 tables</text>
    <rect class="card" x="660" width="224" height="88" rx="18"/>
    <text class="muted tiny" x="684" y="30">QUALITY STATUS</text>
    <text class="ink" font-size="28" x="684" y="64">Review-ready</text>
  </g>

  <rect class="card" x="176" y="272" width="350" height="282" rx="22"/>
  <text class="ink label" x="206" y="312">Manuscript page</text>
  <rect class="paper" x="230" y="334" width="236" height="174" rx="12"/>
  <rect class="dark" x="260" y="362" width="118" height="10" rx="5"/>
  <rect class="rule" x="260" y="392" width="170" height="7" rx="4"/>
  <rect class="rule" x="260" y="414" width="148" height="7" rx="4"/>
  <rect class="soft" x="260" y="446" width="148" height="34" rx="7"/>
  <rect class="teal" x="278" y="458" width="18" height="12" rx="3"/>
  <rect class="orange" x="306" y="452" width="18" height="18" rx="3"/>
  <rect class="dark" x="334" y="442" width="18" height="28" rx="3"/>
  <text class="muted small" x="206" y="532">Clean headings, body spacing and figure placement.</text>

  <rect class="card" x="558" y="272" width="262" height="282" rx="22"/>
  <text class="ink label" x="588" y="312">Style system</text>
  <rect class="soft" x="588" y="342" width="202" height="42" rx="12"/>
  <text class="ink tiny" x="610" y="368">Heading 1</text>
  <rect class="soft" x="588" y="398" width="202" height="42" rx="12"/>
  <text class="ink tiny" x="610" y="424">Body text</text>
  <rect class="soft" x="588" y="454" width="202" height="42" rx="12"/>
  <text class="ink tiny" x="610" y="480">Caption field</text>
  <rect class="teal" x="742" y="356" width="28" height="10" rx="5"/>
  <rect class="teal" x="742" y="412" width="28" height="10" rx="5"/>
  <rect class="orange" x="742" y="468" width="28" height="10" rx="5"/>
  <text class="muted small" x="588" y="532">Styles make later edits and exports predictable.</text>

  <rect class="card" x="852" y="272" width="222" height="282" rx="22"/>
  <text class="ink label" x="882" y="312">Output checks</text>
  <circle class="success" cx="894" cy="356" r="7"/><text class="muted small" x="914" y="362">Caption order</text>
  <circle class="success" cx="894" cy="400" r="7"/><text class="muted small" x="914" y="406">Table widths</text>
  <circle class="warn" cx="894" cy="444" r="7"/><text class="muted small" x="914" y="450">Equation labels</text>
  <circle class="success" cx="894" cy="488" r="7"/><text class="muted small" x="914" y="494">PDF export</text>

  <rect class="soft" x="176" y="584" width="898" height="36" rx="14"/>
  <text class="ink tiny" x="204" y="607">Formatting goal:</text>
  <text class="muted tiny" x="316" y="607">make the article navigable, consistent and ready for Word/PDF review without changing the technical argument.</text>
</svg>
