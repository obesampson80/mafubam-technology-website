<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Research manuscript formatting dashboard</title>
  <desc id="desc">A professional document-formatting dashboard showing manuscript structure, Word styles, captions, tables, figures, equations and final output readiness.</desc>
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #0b1f35; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #0b1f35; }
      .copy { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; }
      .shell { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; }
      .nav { fill: #0b1f35; }
      .card { fill: #ffffff; stroke: #d7e2ea; stroke-width: 1.4; }
      .soft { fill: #f8fafc; stroke: #d7e2ea; stroke-width: 1.4; }
      .paper { fill: #ffffff; stroke: #334155; stroke-width: 1.3; }
      .teal { fill: #0e9caf; }
      .orange { fill: #f97316; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <rect x="34" y="30" width="1132" height="620" rx="5" class="shell"/>
  <rect x="34" y="30" width="92" height="620" rx="5" class="nav"/>
  <rect x="62" y="66" width="36" height="36" rx="4" fill="#e8f7fb"/>
  <text x="74" y="90" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0b1f35">M</text>
  <g fill="#e8f7fb" opacity="0.88"><rect x="68" y="150" width="24" height="6" rx="3"/><rect x="68" y="204" width="24" height="6" rx="3"/><rect x="68" y="258" width="24" height="6" rx="3"/><rect x="68" y="312" width="24" height="6" rx="3"/><rect x="68" y="366" width="24" height="6" rx="3"/></g>

  <text x="164" y="78" class="title">Research Manuscript Formatting Workspace</text>
  <text x="164" y="106" class="small">Public-safe recreation of a Markdown-to-Word article preparation workflow.</text>

  <rect x="164" y="142" width="214" height="92" rx="4" class="soft"/>
  <text x="188" y="174" class="copy">SECTION STRUCTURE</text><text x="188" y="210" class="title">IMRaD</text>
  <rect x="402" y="142" width="214" height="92" rx="4" class="soft"/>
  <text x="426" y="174" class="copy">FIGURES CHECKED</text><text x="426" y="210" class="title">4</text>
  <rect x="640" y="142" width="214" height="92" rx="4" class="soft"/>
  <text x="664" y="174" class="copy">TABLES NORMALISED</text><text x="664" y="210" class="title">6</text>
  <rect x="878" y="142" width="230" height="92" rx="4" class="soft"/>
  <text x="902" y="174" class="copy">OUTPUT</text><text x="902" y="210" class="title">DOCX ready</text>

  <rect x="164" y="270" width="300" height="250" rx="4" class="card"/>
  <text x="190" y="308" class="head">Manuscript Page</text>
  <rect x="202" y="330" width="224" height="150" rx="3" class="paper"/>
  <rect x="230" y="354" width="108" height="10" rx="5" fill="#0b1f35"/>
  <rect x="230" y="382" width="166" height="7" rx="4" fill="#cbd5e1"/>
  <rect x="230" y="402" width="146" height="7" rx="4" fill="#cbd5e1"/>
  <rect x="230" y="432" width="168" height="36" rx="3" fill="#f8fafc" stroke="#d7e2ea"/>
  <text x="230" y="502" class="small">Headings, body text and spacing made consistent</text>

  <rect x="492" y="270" width="296" height="250" rx="4" class="card"/>
  <text x="518" y="308" class="head">Figure and Table Control</text>
  <rect x="524" y="338" width="100" height="62" rx="4" class="soft"/>
  <g class="teal"><rect x="544" y="374" width="12" height="16"/><rect x="570" y="358" width="12" height="32"/><rect x="596" y="346" width="12" height="44"/></g>
  <text x="644" y="362" class="copy">Figure fields</text><text x="644" y="388" class="copy">Caption numbering</text>
  <rect x="524" y="428" width="224" height="54" rx="4" class="soft"/>
  <path d="M544 446H728M544 464H728M604 428V482M666 428V482" class="grid"/>
  <text x="524" y="504" class="small">Tables use readable widths and light rules</text>

  <rect x="820" y="270" width="288" height="250" rx="4" class="card"/>
  <text x="846" y="308" class="head">Quality Checklist</text>
  <text x="846" y="352" class="copy">Automatic heading structure</text><rect x="1030" y="342" width="36" height="10" rx="5" class="teal"/>
  <text x="846" y="388" class="copy">Figure/table captions</text><rect x="1030" y="378" width="36" height="10" rx="5" class="teal"/>
  <text x="846" y="424" class="copy">Equation numbering</text><rect x="1030" y="414" width="36" height="10" rx="5" class="orange"/>
  <text x="846" y="460" class="copy">Reference section cleanup</text><rect x="1030" y="450" width="36" height="10" rx="5" class="teal"/>

  <rect x="164" y="550" width="944" height="56" rx="4" fill="#f8fafc" stroke="#d7e2ea"/>
  <text x="190" y="584" class="head">Formatting goal</text>
  <text x="328" y="574" class="copy">Make the research article navigable, consistent and ready for Word/PDF review</text>
  <text x="328" y="594" class="copy">without changing the author's technical argument.</text>
</svg>
