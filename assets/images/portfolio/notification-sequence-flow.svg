<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Notification delivery sequence</title>
  <desc id="desc">A professional sequence diagram showing request intake, context preparation, decision scoring, delivery control and user-response feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L11 6L1 11Z" fill="#0f172a"/>
    </marker>
    <marker id="return-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L11 6L1 11Z" fill="#b45309"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #0b1f35; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #0b1f35; }
      .msg-label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; }
      .life { stroke: #cbd5e1; stroke-width: 1.8; stroke-dasharray: 7 8; }
      .activation { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.3; }
      .msg { stroke: #0f172a; stroke-width: 2.2; fill: none; stroke-linecap: round; marker-end: url(#arrow); }
      .return { stroke: #b45309; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 7 6; marker-end: url(#return-arrow); }
    </style>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="38" y="34" width="884" height="468" rx="5" class="panel"/>
  <text x="72" y="82" class="title">Notification Delivery Sequence</text>

  <text x="76" y="142" class="head">User device</text>
  <text x="226" y="142" class="head">Input gateway</text>
  <text x="398" y="142" class="head">Context service</text>
  <text x="580" y="142" class="head">Decision engine</text>
  <text x="756" y="142" class="head">Delivery controller</text>

  <path d="M116 162V454" class="life"/>
  <path d="M278 162V454" class="life"/>
  <path d="M466 162V454" class="life"/>
  <path d="M650 162V454" class="life"/>
  <path d="M826 162V454" class="life"/>

  <rect x="110" y="190" width="12" height="246" rx="2" class="activation"/>
  <rect x="272" y="210" width="12" height="116" rx="2" class="activation"/>
  <rect x="460" y="250" width="12" height="78" rx="2" class="activation"/>
  <rect x="644" y="306" width="12" height="70" rx="2" class="activation"/>
  <rect x="820" y="360" width="12" height="54" rx="2" class="activation"/>

  <path d="M122 212H266" class="msg"/>
  <text x="144" y="202" class="msg-label">send notification request</text>
  <path d="M284 252H454" class="msg"/>
  <text x="314" y="242" class="msg-label">prepare context evidence</text>
  <path d="M472 308H638" class="msg"/>
  <text x="498" y="298" class="msg-label">context feature vector</text>
  <path d="M656 362H814" class="msg"/>
  <text x="682" y="352" class="msg-label">delivery recommendation</text>
  <path d="M826 414H124" class="return"/>
  <text x="350" y="404" class="msg-label">delivery action returned to device</text>
  <path d="M122 446H266" class="return"/>
  <text x="144" y="472" class="msg-label">user response updates interaction history</text>
</svg>
