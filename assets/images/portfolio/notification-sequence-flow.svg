<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Notification decision sequence</title>
  <desc id="desc">A simplified sequence diagram showing how a notification moves through orchestration, context extraction, prediction, scheduling and feedback.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#0c9bb2"/></marker><style>.t{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;fill:#08233f}.h{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:800;fill:#08233f}.m{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;fill:#50657a}.life{stroke:#c9d8e2;stroke-width:2;stroke-dasharray:7 8}.msg{stroke:#0c9bb2;stroke-width:4;fill:none;stroke-linecap:round;marker-end:url(#arrow)}.ret{stroke:#f28a35;stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:8 7;marker-end:url(#arrow)}</style></defs>
  <rect width="960" height="540" fill="#f7fbfc"/><rect x="42" y="38" width="876" height="464" rx="18" fill="#fff" stroke="#d7e4eb" stroke-width="2"/><text x="76" y="88" class="t">Sequence flow</text>
  <g><text x="86" y="146" class="h">User device</text><text x="248" y="146" class="h">Orchestrator</text><text x="420" y="146" class="h">Feature extractor</text><text x="610" y="146" class="h">Predictor</text><text x="778" y="146" class="h">Scheduler</text></g>
  <g class="life"><path d="M124 166V448"/><path d="M300 166V448"/><path d="M478 166V448"/><path d="M650 166V448"/><path d="M818 166V448"/></g>
  <path d="M124 204H292" class="msg"/><text x="154" y="194" class="m">notification arrives</text>
  <path d="M300 254H470" class="msg"/><text x="326" y="244" class="m">request context features</text>
  <path d="M478 304H642" class="msg"/><text x="506" y="294" class="m">model-ready vector</text>
  <path d="M650 354H810" class="msg"/><text x="676" y="344" class="m">receptivity probability</text>
  <path d="M818 404H132" class="ret"/><text x="360" y="394" class="m">delivery action and feedback update</text>
</svg>
