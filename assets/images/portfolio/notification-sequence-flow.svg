<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Notification delivery sequence flow</title>
  <desc id="desc">A professional sequence diagram showing request intake, context preparation, scoring, delivery control and user-response feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#0f172a"/></marker>
    <marker id="return-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#b45309"/></marker>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700;fill:#0b1f35}.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#475569}.head{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#0b1f35}.msg-label{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:600;fill:#475569}.small{font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;fill:#64748b}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.8}.lane{fill:#fff;stroke:#cbd5e1;stroke-width:1.3}.life{stroke:#cbd5e1;stroke-width:1.8;stroke-dasharray:7 8}.activation{fill:#ffffff;stroke:#94a3b8;stroke-width:1.3}.msg{stroke:#0f172a;stroke-width:2.2;fill:none;stroke-linecap:round;marker-end:url(#arrow)}.return{stroke:#b45309;stroke-width:2;fill:none;stroke-linecap:round;stroke-dasharray:7 6;marker-end:url(#return-arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="56" y="56" class="title">Notification Delivery Sequence</text>
  <text x="56" y="84" class="subtitle">Runtime order from incoming notification request to delivery action and response feedback.</text>
  <rect x="56" y="118" width="1088" height="508" rx="5" class="panel"/>

  <g transform="translate(84 150)">
    <rect class="lane" x="0" y="0" width="160" height="46" rx="4"/><text class="head" x="34" y="29">User device</text>
    <rect class="lane" x="210" y="0" width="160" height="46" rx="4"/><text class="head" x="240" y="29">Input gateway</text>
    <rect class="lane" x="420" y="0" width="160" height="46" rx="4"/><text class="head" x="446" y="29">Context service</text>
    <rect class="lane" x="630" y="0" width="160" height="46" rx="4"/><text class="head" x="656" y="29">Decision engine</text>
    <rect class="lane" x="840" y="0" width="160" height="46" rx="4"/><text class="head" x="858" y="29">Delivery control</text>

    <path d="M80 46V414" class="life"/><path d="M290 46V414" class="life"/><path d="M500 46V414" class="life"/><path d="M710 46V414" class="life"/><path d="M920 46V414" class="life"/>
    <rect x="74" y="82" width="12" height="278" rx="2" class="activation"/><rect x="284" y="110" width="12" height="96" rx="2" class="activation"/><rect x="494" y="162" width="12" height="78" rx="2" class="activation"/><rect x="704" y="226" width="12" height="70" rx="2" class="activation"/><rect x="914" y="284" width="12" height="70" rx="2" class="activation"/>

    <path d="M86 112H276" class="msg"/><text class="msg-label" x="118" y="102">submit notification request</text>
    <path d="M296 166H486" class="msg"/><text class="msg-label" x="324" y="156">prepare context evidence</text>
    <path d="M506 230H696" class="msg"/><text class="msg-label" x="540" y="220">send feature vector</text>
    <path d="M716 288H906" class="msg"/><text class="msg-label" x="744" y="278">return delivery recommendation</text>
    <path d="M914 348H88" class="return"/><text class="msg-label" x="430" y="338">delivery action returned to device</text>
    <path d="M86 386H276" class="return"/><text class="msg-label" x="112" y="410">response updates interaction history</text>
  </g>
  <text x="84" y="604" class="small">Dashed return messages separate feedback from the main decision path.</text>
</svg>
