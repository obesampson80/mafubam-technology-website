<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Student support dashboard interface overview</title>
  <desc id="desc">A recreated dashboard screen for student risk review showing navigation, metrics, filters, a case table and a selected case panel.</desc>
  <defs><style>.bg{fill:#f4f9fb}.app{fill:#fff;stroke:#cfe0e8;stroke-width:2}.side{fill:#082744}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.white{fill:#fff;font-family:Arial,Helvetica,sans-serif}.small{font-size:14px}.tiny{font-size:12px}.label{font-size:18px}.title{font-size:28px}.card{fill:#fff;stroke:#d9e8ef;stroke-width:1.5}.soft{fill:#eaf3f6}.accent{fill:#0e9aac}.orange{fill:#f68a3c}.red{fill:#d95757}.green{fill:#25a96a}.line{stroke:#d9e8ef;stroke-width:1}</style></defs>
  <rect class="bg" width="1100" height="720"/>
  <rect class="app" x="34" y="34" width="1032" height="652" rx="28"/>
  <rect class="side" x="34" y="34" width="240" height="652" rx="28"/>
  <rect class="side" x="226" y="34" width="48" height="652"/>
  <rect x="70" y="78" width="44" height="44" rx="12" fill="#0e9aac"/><text class="white" font-weight="700" font-size="18" x="80" y="106">SR</text>
  <text class="white" font-weight="700" font-size="21" x="70" y="158">Student Support</text>
  <text class="white small" x="70" y="182" opacity=".72">Risk review dashboard</text>
  <g class="white small" opacity=".9"><rect x="62" y="226" width="176" height="38" rx="12" fill="#123a5d"/><text x="88" y="251">Work Queue</text><text x="88" y="303">Data Intake</text><text x="88" y="355">Case Review</text><text x="88" y="407">Interventions</text><text x="88" y="459">Explainability</text><text x="88" y="511">Reports</text></g>
  <text class="ink title" x="318" y="92">Student Support Work Queue</text>
  <text class="muted small" x="320" y="120">Prioritised cases generated from model screening.</text>
  <g transform="translate(318 154)">
    <rect class="card" width="160" height="86" rx="14"/><text class="muted tiny" x="22" y="32">Filtered cases</text><text class="ink label" x="22" y="62">128</text>
    <rect class="card" x="182" width="160" height="86" rx="14"/><text class="muted tiny" x="204" y="32">At risk</text><text class="ink label" x="204" y="62">47</text>
    <rect class="card" x="364" width="160" height="86" rx="14"/><text class="muted tiny" x="386" y="32">Critical</text><text class="ink label" x="386" y="62">12</text>
    <rect class="card" x="546" width="160" height="86" rx="14"/><text class="muted tiny" x="568" y="32">Unassigned</text><text class="ink label" x="568" y="62">19</text>
  </g>
  <rect class="card" x="318" y="274" width="464" height="336" rx="18"/>
  <text class="ink label" x="348" y="316">Prioritised cases</text>
  <rect class="soft" x="348" y="346" width="132" height="30" rx="9"/><rect class="soft" x="492" y="346" width="94" height="30" rx="9"/><rect class="soft" x="598" y="346" width="118" height="30" rx="9"/>
  <line class="line" x1="348" y1="408" x2="742" y2="408"/><line class="line" x1="348" y1="464" x2="742" y2="464"/><line class="line" x1="348" y1="520" x2="742" y2="520"/>
  <rect class="red" x="350" y="426" width="70" height="24" rx="12"/><text class="white tiny" x="366" y="443">Critical</text><rect class="orange" x="350" y="482" width="70" height="24" rx="12"/><text class="white tiny" x="372" y="499">High</text><rect class="accent" x="350" y="538" width="90" height="24" rx="12"/><text class="white tiny" x="368" y="555">Moderate</text>
  <rect class="soft" x="456" y="429" width="176" height="12" rx="6"/><rect class="soft" x="456" y="485" width="212" height="12" rx="6"/><rect class="soft" x="456" y="541" width="152" height="12" rx="6"/>
  <rect class="card" x="810" y="274" width="208" height="336" rx="18"/>
  <text class="ink label" x="838" y="316">Selected case</text>
  <circle class="red" cx="856" cy="364" r="12"/><text class="ink small" x="884" y="370">Critical risk</text>
  <text class="muted tiny" x="838" y="414">Main reason</text><rect class="soft" x="838" y="430" width="142" height="12" rx="6"/><rect class="soft" x="838" y="452" width="112" height="12" rx="6"/>
  <text class="muted tiny" x="838" y="498">Next action</text><rect class="accent" x="838" y="518" width="132" height="34" rx="10"/><text class="white tiny" x="860" y="540">Review case</text>
</svg>
