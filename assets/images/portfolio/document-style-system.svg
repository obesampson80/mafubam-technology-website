<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Word manuscript style system</title>
  <desc id="desc">A modern style-system view showing heading hierarchy, body text, captions, tables, equations and references formatted for a research article.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#082744" flood-opacity="0.12"/></filter>
    <style>.bg{fill:#eef7fa}.panel{fill:#fff;stroke:#cfe0e8;stroke-width:2}.card{fill:#fff;stroke:#d8e7ee;stroke-width:1.5}.soft{fill:#eaf3f6}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.title{font-size:29px}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:12px}.teal{fill:#0e9aac}.orange{fill:#f68a3c}.dark{fill:#082744}.rule{fill:#d8e7ee}.line{stroke:#d8e7ee;stroke-width:1.4}.paper{fill:#fff;stroke:#d8e7ee;stroke-width:1.5}</style>
  </defs>
  <rect class="bg" width="1100" height="660"/>
  <rect class="panel" x="32" y="30" width="1036" height="600" rx="26" filter="url(#shadow)"/>
  <text class="ink title" x="72" y="84">Word style system</text>
  <text class="muted small" x="74" y="112">Reusable formatting rules keep manuscript pages consistent during review and export.</text>

  <rect class="card" x="72" y="154" width="294" height="386" rx="22"/>
  <text class="ink label" x="104" y="198">Text hierarchy</text>
  <rect class="paper" x="104" y="226" width="224" height="234" rx="14"/>
  <text class="ink tiny" x="132" y="262">Heading 1</text>
  <rect class="dark" x="132" y="278" width="126" height="10" rx="5"/>
  <text class="muted tiny" x="132" y="318">Heading 2</text>
  <rect class="teal" x="132" y="334" width="104" height="8" rx="4"/>
  <text class="muted tiny" x="132" y="374">Body paragraph</text>
  <rect class="rule" x="132" y="390" width="154" height="7" rx="4"/>
  <rect class="rule" x="132" y="412" width="134" height="7" rx="4"/>
  <text class="muted small" x="104" y="502">Headings and body text follow one visible system.</text>

  <rect class="card" x="404" y="154" width="294" height="386" rx="22"/>
  <text class="ink label" x="436" y="198">Captions and figures</text>
  <rect class="soft" x="436" y="226" width="224" height="116" rx="16"/>
  <rect class="teal" x="472" y="294" width="24" height="28" rx="4"/>
  <rect class="orange" x="518" y="270" width="24" height="52" rx="4"/>
  <rect class="dark" x="564" y="248" width="24" height="74" rx="4"/>
  <text class="ink tiny" x="436" y="382">Figure 1: architecture view</text>
  <rect class="rule" x="436" y="398" width="196" height="7" rx="4"/>
  <text class="ink tiny" x="436" y="434">Table 1: simulation parameters</text>
  <rect class="rule" x="436" y="450" width="178" height="7" rx="4"/>
  <text class="muted small" x="436" y="502">Caption order and list entries stay traceable.</text>

  <rect class="card" x="736" y="154" width="292" height="386" rx="22"/>
  <text class="ink label" x="768" y="198">Tables and equations</text>
  <rect class="soft" x="768" y="226" width="218" height="106" rx="16"/>
  <path d="M798 258H956M798 292H956M852 226V332M908 226V332" class="line"/>
  <rect class="paper" x="768" y="366" width="218" height="72" rx="14"/>
  <text class="ink label" x="798" y="410">E = P x t</text>
  <text class="muted small" x="944" y="410">(1)</text>
  <text class="muted small" x="768" y="480">Tables, equations and references align cleanly.</text>
</svg>
