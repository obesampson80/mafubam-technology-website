<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">LoRaWAN defence presentation deck overview</title>
  <desc id="desc">A recreated slide deck preview showing presentation sections, selected slides and speaker notes for a LoRaWAN certificate revocation defence.</desc>
  <defs>
    <style>
      .bg{fill:#f4f9fb}.panel{fill:#fff;stroke:#cfe0e8;stroke-width:2}.dark{fill:#082744}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.small{font-size:17px}.label{font-size:20px}.title{font-size:32px}.tiny{font-size:13px}.accent{fill:#0e9aac}.orange{fill:#f68a3c}.line{stroke:#0e9aac;stroke-width:5;stroke-linecap:round}.grid{stroke:#e2edf2;stroke-width:1}.soft{fill:#eaf3f6}.note{fill:#fff7ef;stroke:#f7bd8d;stroke-width:2}.bar{fill:#dcecf2}.bar2{fill:#0e9aac}.bar3{fill:#f68a3c}.bar4{fill:#082744}
    </style>
  </defs>
  <rect class="bg" width="1100" height="720"/>
  <rect class="panel" x="34" y="34" width="1032" height="652" rx="28"/>
  <text class="ink title" x="74" y="92">Defence deck: LoRaWAN certificate revocation</text>
  <text class="muted small" x="76" y="124">Public-safe recreation of slide structure, evidence hierarchy and speaker preparation.</text>

  <rect class="dark" x="72" y="162" width="392" height="222" rx="18"/>
  <text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="27" x="102" y="212">Lightweight Certificate</text>
  <text fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="27" x="102" y="248">Revocation Protocol</text>
  <text fill="#9fdfe8" font-family="Arial,Helvetica,sans-serif" font-size="17" x="104" y="292">Resource-constrained LoRaWAN devices</text>
  <rect x="104" y="322" width="86" height="10" rx="5" fill="#4fd4e7"/>
  <rect x="202" y="322" width="58" height="10" rx="5" fill="#f68a3c"/>
  <rect x="272" y="322" width="112" height="10" rx="5" fill="#ffffff" opacity=".55"/>

  <rect class="panel" x="506" y="162" width="252" height="134" rx="16"/>
  <text class="ink label" x="532" y="204">Problem slide</text>
