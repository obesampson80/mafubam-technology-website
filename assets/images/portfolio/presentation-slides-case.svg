  <rect class="bar" x="532" y="258" width="180" height="12" rx="6"/>
  <rect class="bar3" x="532" y="258" width="78" height="12" rx="6"/>

  <rect class="panel" x="792" y="162" width="232" height="134" rx="16"/>
  <text class="ink label" x="818" y="204">Method slide</text>
  <text class="muted tiny" x="818" y="232">Design science workflow</text>
  <circle class="accent" cx="838" cy="262" r="10"/><circle class="accent" cx="898" cy="262" r="10"/><circle class="accent" cx="958" cy="262" r="10"/>
  <path class="line" d="M848 262 H888 M908 262 H948"/>

  <rect class="panel" x="506" y="336" width="252" height="154" rx="16"/>
  <text class="ink label" x="532" y="378">Architecture slide</text>
  <rect class="soft" x="532" y="406" width="52" height="34" rx="8"/><rect class="soft" x="622" y="406" width="72" height="34" rx="8"/><rect class="soft" x="532" y="452" width="162" height="22" rx="7"/>
  <path class="line" d="M584 423 H612 M694 423 H724"/>
  <path d="M724 411 L750 423 L724 435 Z" fill="#0e9aac"/>

