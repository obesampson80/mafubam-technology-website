  <text class="ink label" x="818" y="378">Results slide</text>
  <rect class="bar2" x="826" y="448" width="30" height="28" rx="5"/><rect class="bar3" x="868" y="432" width="30" height="44" rx="5"/><rect class="bar4" x="910" y="416" width="30" height="60" rx="5"/>
  <text class="muted tiny" x="818" y="408">Bytes, energy and cache effect</text>

