<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">LoRaWAN simulator workflow</title>
  <desc id="desc">A clean workflow showing simulator configuration, certificate generation, revocation rules, communication attempts and evidence export.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#0f172a"/></marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #0b1f35; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #0b1f35; }
      .copy { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; }
      .stage { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .input { fill: #e8f7fb; stroke: #0e9caf; stroke-width: 1.6; }
      .output { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.6; }
      .flow { stroke: #0f172a; stroke-width: 2.3; fill: none; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="38" y="34" width="884" height="468" rx="5" class="panel"/>
  <text x="72" y="82" class="title">Prototype Workflow</text>
  <text x="72" y="108" class="subtitle">How the simulator turns protocol rules into reviewable communication evidence.</text>

  <rect x="72" y="170" width="142" height="170" rx="4" class="input"/>
  <text x="98" y="202" class="head">Scenario</text>
  <text x="98" y="232" class="copy">certificates</text><text x="98" y="254" class="copy">devices</text><text x="98" y="276" class="copy">payload and SF</text>
  <rect x="256" y="170" width="142" height="170" rx="4" class="stage"/>
  <text x="282" y="202" class="head">Registry</text>
  <text x="282" y="232" class="copy">certificate IDs</text><text x="282" y="254" class="copy">device owners</text><text x="282" y="276" class="copy">serial preview</text>
  <rect x="440" y="170" width="142" height="170" rx="4" class="stage"/>
  <text x="466" y="202" class="head">Revocation</text>
  <text x="466" y="232" class="copy">expired</text><text x="466" y="254" class="copy">compromised</text><text x="466" y="276" class="copy">policy failed</text>
  <rect x="624" y="170" width="142" height="170" rx="4" class="stage"/>
  <text x="650" y="202" class="head">Attempt</text>
  <text x="650" y="232" class="copy">source sensor</text><text x="650" y="254" class="copy">gateway/server</text><text x="650" y="276" class="copy">MTU and cache</text>
  <rect x="360" y="392" width="240" height="64" rx="4" class="output"/>
  <text x="392" y="420" class="head">Evidence export</text>
  <text x="392" y="442" class="copy">event logs, summaries and CSV files</text>

  <path d="M214 255H248" class="flow"/><path d="M398 255H432" class="flow"/><path d="M582 255H616" class="flow"/><path d="M695 340V366Q695 424 608 424" class="flow"/>
  <text x="72" y="482" class="small">The prototype makes protocol behaviour visible instead of leaving the implementation as backend code only.</text>
</svg>
