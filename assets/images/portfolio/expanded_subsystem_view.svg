<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Subsystem process view for context-aware notification delivery</title>
  <desc id="desc">A professional subsystem process diagram showing notification evidence moving through intake, context preparation, scoring, delivery control and delivery decision output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#0f172a"/></marker>
    <marker id="feedback-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#b45309"/></marker>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700;fill:#0b1f35}.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#475569}.section{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#0b1f35}.box-title{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#0b1f35}.box-copy{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:600;fill:#475569}.small{font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;fill:#64748b}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.8}.system{fill:#fff;stroke:#0f172a;stroke-width:2.1}.module{fill:#fff;stroke:#334155;stroke-width:1.7}.accent{fill:#e8f7fb;stroke:#0e9aac;stroke-width:1.7}.output{fill:#fff7ed;stroke:#c2410c;stroke-width:1.8}.flow{stroke:#0f172a;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.feedback{stroke:#b45309;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7;marker-end:url(#feedback-arrow)}.note{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="56" y="56" class="title">Subsystem Process View</text>
  <text x="56" y="84" class="subtitle">A lower-level view of how notification evidence becomes a delivery decision.</text>

  <rect x="56" y="124" width="1088" height="420" rx="5" class="panel"/>
  <rect x="92" y="216" width="190" height="178" rx="4" class="accent"/>
  <text x="120" y="250" class="section">Evidence intake</text>
  <text x="120" y="288" class="box-copy">notification request</text>
  <text x="120" y="312" class="box-copy">context state</text>
  <text x="120" y="336" class="box-copy">interaction history</text>

  <rect x="354" y="216" width="190" height="178" rx="4" class="module"/>
  <text x="382" y="250" class="section">Context preparation</text>
  <text x="382" y="288" class="box-copy">validate records</text>
  <text x="382" y="312" class="box-copy">normalise values</text>
  <text x="382" y="336" class="box-copy">build feature set</text>

  <rect x="616" y="216" width="190" height="178" rx="4" class="module"/>
  <text x="644" y="250" class="section">Decision scoring</text>
  <text x="644" y="288" class="box-copy">estimate receptivity</text>
  <text x="644" y="312" class="box-copy">apply priority rules</text>
  <text x="644" y="336" class="box-copy">rank delivery options</text>

  <rect x="878" y="216" width="190" height="178" rx="4" class="module"/>
  <text x="906" y="250" class="section">Delivery control</text>
  <text x="906" y="288" class="box-copy">select action</text>
  <text x="906" y="312" class="box-copy">set timing window</text>
  <text x="906" y="336" class="box-copy">record response state</text>

  <path d="M282 305H346" class="flow"/>
  <path d="M544 305H608" class="flow"/>
  <path d="M806 305H870" class="flow"/>

  <rect x="738" y="466" width="330" height="58" rx="4" class="output"/>
  <text x="766" y="492" class="box-title">Delivery decision</text>
  <text x="766" y="512" class="box-copy">deliver now, defer or batch notification</text>
  <path d="M973 394V456" class="flow"/>

  <rect x="354" y="466" width="250" height="58" rx="4" class="note"/>
  <text x="382" y="492" class="box-title">Feature evidence</text>
  <text x="382" y="512" class="box-copy">validated context and priority values</text>

  <path d="M904 524V604H188V402" class="feedback"/>
  <text x="360" y="632" class="small">Feedback from user response updates interaction history for later decisions.</text>
</svg>
