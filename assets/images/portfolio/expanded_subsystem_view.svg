<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Simplified subsystem flow for notification receptivity prediction</title>
  <desc id="svg-desc">A clean website diagram showing the verified flow from notification evidence to feature preparation, prediction, validation and scheduling output.</desc>
  <defs>
    <filter id="soft-shadow" x="-12%" y="-16%" width="124%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#08233f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L11 6L1 11Z" fill="#0c9bb2"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L11 6L1 11Z" fill="#f28a35"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 800; fill: #08233f; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 650; fill: #50657a; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 800; fill: #08233f; }
      .card-copy { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 650; fill: #50657a; }
      .badge { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 800; fill: #0b2a46; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 750; fill: #7a4a20; }
      .flow { stroke: #0c9bb2; stroke-width: 4; fill: none; stroke-linecap: round; marker-end: url(#arrow-teal); }
      .feedback { stroke: #f28a35; stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 8 8; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#f7fbfc"/>
  <rect x="22" y="20" width="1156" height="480" rx="24" fill="#ffffff" stroke="#d7e4eb" stroke-width="2"/>

  <text x="58" y="72" class="title">Subsystem flow summary</text>
  <text x="58" y="100" class="subtitle">Web version of the verified project architecture: intake, feature preparation, prediction, validation and scheduling evidence.</text>

  <g filter="url(#soft-shadow)">
    <rect x="58" y="162" width="178" height="148" rx="16" fill="#edf6f8" stroke="#d2e2ea" stroke-width="2"/>
    <rect x="285" y="162" width="178" height="148" rx="16" fill="#ffffff" stroke="#d2e2ea" stroke-width="2"/>
    <rect x="512" y="162" width="178" height="148" rx="16" fill="#ffffff" stroke="#d2e2ea" stroke-width="2"/>
    <rect x="739" y="162" width="178" height="148" rx="16" fill="#ffffff" stroke="#d2e2ea" stroke-width="2"/>
    <rect x="966" y="162" width="178" height="148" rx="16" fill="#edf6f8" stroke="#d2e2ea" stroke-width="2"/>
  </g>

  <g>
    <text x="86" y="204" class="card-title">1. Intake</text>
    <text x="86" y="235" class="card-copy">Notification metadata</text>
    <text x="86" y="257" class="card-copy">Context signals</text>
    <text x="86" y="279" class="card-copy">Interaction history</text>

    <text x="313" y="204" class="card-title">2. Features</text>
    <text x="313" y="235" class="card-copy">Leakage-safe selection</text>
    <text x="313" y="257" class="card-copy">Encoding and scaling</text>
    <text x="313" y="279" class="card-copy">Priority predictors</text>

    <text x="540" y="204" class="card-title">3. Predict</text>
    <text x="540" y="235" class="card-copy">Tree-based models</text>
    <text x="540" y="257" class="card-copy">Receptivity probability</text>
    <text x="540" y="279" class="card-copy">Ensemble comparison</text>

    <text x="767" y="204" class="card-title">4. Validate</text>
    <text x="767" y="235" class="card-copy">Chronological testing</text>
    <text x="767" y="257" class="card-copy">Personalised checks</text>
    <text x="767" y="279" class="card-copy">User-holdout results</text>

    <text x="994" y="204" class="card-title">5. Schedule</text>
    <text x="994" y="235" class="card-copy">Deliver, defer or batch</text>
    <text x="994" y="257" class="card-copy">Metrics and report tables</text>
    <text x="994" y="279" class="card-copy">Reusable evidence</text>
  </g>

  <g>
    <path d="M236 236H276" class="flow"/>
    <path d="M463 236H503" class="flow"/>
    <path d="M690 236H730" class="flow"/>
    <path d="M917 236H957" class="flow"/>
  </g>

  <g>
    <rect x="112" y="356" width="186" height="38" rx="19" fill="#edf6f8" stroke="#d2e2ea"/>
    <text x="205" y="380" text-anchor="middle" class="badge">time, location, behaviour</text>

    <rect x="386" y="356" width="186" height="38" rx="19" fill="#edf6f8" stroke="#d2e2ea"/>
    <text x="479" y="380" text-anchor="middle" class="badge">urgency and priority</text>

    <rect x="660" y="356" width="186" height="38" rx="19" fill="#edf6f8" stroke="#d2e2ea"/>
    <text x="753" y="380" text-anchor="middle" class="badge">macro F1 and AUC-ROC</text>
  </g>

  <path d="M1060 310C996 442 312 442 190 404" class="feedback"/>
  <text x="522" y="448" class="note">User response updates future interaction-history evidence</text>
</svg>
