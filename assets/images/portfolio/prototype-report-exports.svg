<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">LoRaWAN simulator report export summary</title>
  <desc id="desc">A professional reports view showing certificate summary, communication summary, baseline comparison and CSV export files.</desc>
  <defs><style>
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #0b1f35; }
    .head { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #0b1f35; }
    .copy { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
    .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; }
    .card { fill: #ffffff; stroke: #d7e2ea; stroke-width: 1.4; }
    .soft { fill: #f8fafc; stroke: #d7e2ea; stroke-width: 1.2; }
    .teal { fill: #0e9caf; } .orange { fill: #f97316; } .navy { fill: #0b1f35; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
  </style></defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="38" y="34" width="884" height="468" rx="5" class="panel"/>
  <text x="72" y="82" class="title">Report and Export Evidence</text>
  <rect x="72" y="124" width="260" height="300" rx="4" class="card"/>
  <text x="102" y="162" class="head">CSV exports</text>
  <rect x="102" y="194" width="178" height="30" rx="4" class="soft"/><text x="120" y="214" class="copy">certificate_registry.csv</text>
  <rect x="102" y="236" width="178" height="30" rx="4" class="soft"/><text x="120" y="256" class="copy">communication_events.csv</text>
  <rect x="102" y="278" width="178" height="30" rx="4" class="soft"/><text x="120" y="298" class="copy">blocked_events.csv</text>
  <rect x="102" y="320" width="178" height="30" rx="4" class="soft"/><text x="120" y="340" class="copy">scenario_summary.csv</text>
  <rect x="102" y="362" width="178" height="30" rx="4" class="soft"/><text x="120" y="382" class="copy">baseline_comparison.csv</text>
  <rect x="372" y="124" width="240" height="300" rx="4" class="card"/>
  <text x="402" y="162" class="head">Communication summary</text>
  <g class="grid"><path d="M414 360H560"/><path d="M414 314H560"/><path d="M414 268H560"/></g>
  <rect x="430" y="238" width="36" height="122" rx="4" class="teal"/><rect x="502" y="290" width="36" height="70" rx="4" class="orange"/>
  <text x="422" y="388" class="small">Allowed</text><text x="494" y="388" class="small">Blocked</text>
  <rect x="652" y="124" width="236" height="300" rx="4" class="card"/>
  <text x="682" y="162" class="head">Baseline comparison</text>
  <text x="682" y="212" class="copy">Proposed protocol</text><rect x="682" y="226" width="62" height="10" rx="5" class="teal"/>
  <text x="682" y="262" class="copy">TinyOCSP</text><rect x="682" y="276" width="126" height="10" rx="5" class="orange"/>
  <text x="682" y="312" class="copy">OCSP</text><rect x="682" y="326" width="154" height="10" rx="5" class="orange"/>
  <text x="682" y="362" class="copy">CRL</text><rect x="682" y="376" width="186" height="10" rx="5" class="navy"/>
  <text x="72" y="472" class="copy">The prototype exports the evidence needed for report tables, appendix records and supervisor review.</text>
</svg>
