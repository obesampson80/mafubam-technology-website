<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">LoRaWAN simulator report export summary</title>
  <desc id="desc">A modern reports view showing CSV evidence files, communication summary and baseline comparison for the LoRaWAN simulator.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#082744" flood-opacity="0.12"/></filter><style>.bg{fill:#eef7fa}.panel{fill:#fff;stroke:#cfe0e8;stroke-width:2}.card{fill:#fff;stroke:#d8e7ee;stroke-width:1.5}.soft{fill:#eaf3f6}.ink{fill:#062746;font-family:Arial,Helvetica,sans-serif;font-weight:700}.muted{fill:#4f6680;font-family:Arial,Helvetica,sans-serif}.title{font-size:29px}.label{font-size:18px}.small{font-size:15px}.tiny{font-size:12px}.teal{fill:#0e9aac}.orange{fill:#f68a3c}.dark{fill:#082744}.rule{stroke:#d8e7ee;stroke-width:1.4}.success{fill:#25a96a}</style></defs>
  <rect class="bg" width="1100" height="660"/><rect class="panel" x="32" y="30" width="1036" height="600" rx="26" filter="url(#shadow)"/>
  <text class="ink title" x="72" y="84">Report and export evidence</text><text class="muted small" x="74" y="112">Export files turn simulator activity into report tables and appendix records.</text>
  <rect class="card" x="72" y="154" width="300" height="386" rx="22"/>
  <text class="ink label" x="104" y="198">CSV exports</text>
  <rect class="soft" x="104" y="232" width="220" height="36" rx="12"/><text class="ink tiny" x="128" y="255">certificate_registry.csv</text>
  <rect class="soft" x="104" y="286" width="220" height="36" rx="12"/><text class="ink tiny" x="128" y="309">communication_events.csv</text>
  <rect class="soft" x="104" y="340" width="220" height="36" rx="12"/><text class="ink tiny" x="128" y="363">blocked_events.csv</text>
  <rect class="soft" x="104" y="394" width="220" height="36" rx="12"/><text class="ink tiny" x="128" y="417">scenario_summary.csv</text>
  <rect class="soft" x="104" y="448" width="220" height="36" rx="12"/><text class="ink tiny" x="128" y="471">baseline_comparison.csv</text>
  <rect class="card" x="408" y="154" width="292" height="386" rx="22"/>
  <text class="ink label" x="440" y="198">Communication summary</text>
  <path d="M458 430H626M458 370H626M458 310H626" class="rule"/>
  <rect class="teal" x="480" y="278" width="42" height="152" rx="7"/><rect class="orange" x="564" y="338" width="42" height="92" rx="7"/>
  <text class="muted tiny" x="472" y="466">Allowed</text><text class="muted tiny" x="558" y="466">Blocked</text>
  <text class="muted small" x="440" y="512">Counts separate successful and denied events.</text>
  <rect class="card" x="736" y="154" width="292" height="386" rx="22"/>
  <text class="ink label" x="768" y="198">Baseline comparison</text>
  <text class="muted small" x="768" y="250">Proposed protocol</text><rect class="teal" x="768" y="266" width="74" height="11" rx="6"/>
  <text class="muted small" x="768" y="306">TinyOCSP</text><rect class="orange" x="768" y="322" width="136" height="11" rx="6"/>
  <text class="muted small" x="768" y="362">OCSP</text><rect class="orange" x="768" y="378" width="172" height="11" rx="6"/>
  <text class="muted small" x="768" y="418">CRL</text><rect class="dark" x="768" y="434" width="218" height="11" rx="6"/>
  <text class="muted small" x="768" y="496"><tspan x="768" dy="0">Baselines make the lightweight</tspan><tspan x="768" dy="22">protocol claim easier to inspect.</tspan></text>
</svg>
